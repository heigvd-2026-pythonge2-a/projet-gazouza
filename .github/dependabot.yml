version: 2
updates:
  # Workflows GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "type: chore"
      - "area: shared"

  # Dépendances Frontend (pnpm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "type: chore"
      - "area: shared"

  # Dépendances Site web & documentation (pnpm)
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    labels:
      - "type: chore"
      - "area: docs"

  # Dépendances Backend (Python / uv)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels:
      - "type: chore"
      - "area: backend"
