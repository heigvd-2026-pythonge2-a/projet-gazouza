name: Application Windows

# Builds the portable Windows application (build.ps1) and checks that the zip starts.
# - Run by hand (Actions tab, "Run workflow"): the app is kept as a workflow artifact,
#   to test the build before a delivery.
# - A pushed tag vX.Y.Z: the zip is published in a GitHub release of that tag.
# The release rules are in AGENTS.md ("Releases").
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build de l'application (build.ps1)
    runs-on: windows-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installation de uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Configuration de Python 3.12
        run: uv python install 3.12

      # La version de pnpm est lue dans le champ "packageManager" de frontend/package.json.
      - name: Installation de pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Configuration de Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # -Verify extracts dist/Psice.zip, marks the files as downloaded from the Internet (like a
      # browser download) and runs Psice.exe --self-check from it: frontend files, /api/health,
      # component library, an offline RC simulation with ngspice and the window's .NET runtime.
      - name: Build et vérification du zip
        shell: pwsh
        run: ./build.ps1 -Verify

      # An artifact name cannot contain "/" (branch names such as feat/x).
      - name: Nom de l'artefact
        id: artifact
        shell: bash
        env:
          REF: ${{ github.ref_name }}
        run: echo "name=Psice-${REF//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The folder, not the zip: the artifact is already downloaded as a zip.
      - name: Envoi de l'application (artefact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/Psice/
          if-no-files-found: error

      - name: Envoi du zip pour la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: dist/Psice.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publication de la release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupération du zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip

      # The asset keeps the name Psice.zip in every release, so that
      # releases/latest/download/Psice.zip always points to the latest version.
      # A tag with a suffix (v1.0.0-rc.1) is published as a pre-release.
      - name: Création de la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" Psice.zip \
            --repo "${{ github.repository }}" \
            --title "Psice $TAG" \
            --generate-notes \
            --verify-tag \
            $prerelease
