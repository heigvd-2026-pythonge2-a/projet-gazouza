name: Issue status

# Keeps the GitHub status of the issues a pull request closes ("Closes #N") in step with
# the pull request: In review while it is open and ready, In progress while it is a draft,
# Todo when it is closed without being merged. A merge closes the issues, which GitHub
# then moves to Done on its own. Moving an issue to In progress when work starts on a
# branch stays manual (see AGENTS.md).
#
# GitHub only links "Closes #N" to the issue for a pull request into the default branch, so
# the issues are also read from the description: a stacked pull request (based on another
# branch) moves its issues too.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed, edited]

permissions:
  issues: write
  pull-requests: read

concurrency:
  group: issue-status-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  status:
    # A merged pull request needs nothing: its issues are closed and moved to Done.
    # Editing a closed pull request changes nothing either.
    if: >-
      ${{ (github.event.action == 'closed' && !github.event.pull_request.merged)
      || (github.event.action != 'closed' && github.event.pull_request.state == 'open') }}
    runs-on: ubuntu-latest
    steps:
      - name: Set the status of the linked issues
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$ACTION" = "closed" ]; then
            target="Todo"
          elif [ "$DRAFT" = "true" ]; then
            target="In progress"
          else
            target="In review"
          fi

          # The status ids of the repository and the issues GitHub links to the pull request.
          data=$(gh api graphql \
            -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){planningStatuses(first:20){nodes{id name}} pullRequest(number:$n){closingIssuesReferences(first:20){nodes{number}}}}}' \
            -f o="$OWNER" -f r="$REPO" -F n="$PR")
          status_id=$(jq -r --arg t "$target" '.data.repository.planningStatuses.nodes[] | select(.name == $t) | .id' <<<"$data")
          if [ -z "$status_id" ]; then
            echo "No status named \"$target\" in this repository: nothing to do."
            exit 0
          fi

          # Linked issues, plus the "Closes #N" of the description (close, fix, resolve and
          # their forms), which GitHub does not link for a pull request into another branch.
          numbers=$(
            {
              jq -r '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' <<<"$data"
              grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+\b' <<<"${BODY:-}" |
                grep -oE '[0-9]+$' || true
            } | sort -un
          )

          for number in $numbers; do
            # A number that is not an issue (a pull request, a typo) is skipped.
            if ! issue=$(gh api graphql \
              -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){issue(number:$n){id state status{name}}}}' \
              -f o="$OWNER" -f r="$REPO" -F n="$number" \
              --jq '.data.repository.issue | "\(.id) \(.state) \(.status.name // "none")"' 2>/dev/null); then
              echo "#$number is not an issue: skipped."
              continue
            fi
            read -r id state current <<<"$issue"
            # Only open issues; an issue already Done or Not planned is left alone.
            if [ "$state" != "OPEN" ]; then
              echo "#$number is closed: left alone."
              continue
            fi
            case "$current" in
              Done | "Not planned" | Duplicate)
                echo "#$number is $current: left alone."
                continue
                ;;
            esac
            if [ "$current" = "$target" ]; then
              echo "#$number already $target."
              continue
            fi
            gh api graphql \
              -f query='mutation($i:ID!,$s:ID!){setIssueStatus(input:{issueId:$i,statusId:$s}){clientMutationId}}' \
              -f i="$id" -f s="$status_id" > /dev/null
            echo "#$number: $current -> $target"
          done
