name: Badges

# Regenerates the README badges (milestone progress, open issues) and pushes them
# to the orphan `badges` branch. The repository is private, so shields.io cannot read it.
on:
  issues:
    types: [opened, closed, reopened, deleted, transferred, milestoned, demilestoned]
  pull_request_target:
    types: [opened, closed, reopened, milestoned, demilestoned]
  milestone:
    types: [created, edited, deleted, closed, opened]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

# Bulk edits fire many events at once: only the latest run needs to finish.
concurrency:
  group: badges
  cancel-in-progress: true

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      # Checks out the default branch only (never the PR head): no PR code is run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/milestone-badges.sh "$RUNNER_TEMP/badges"

      - name: Push to the badges branch
        working-directory: ${{ runner.temp }}/badges
        run: |
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: update badges"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
