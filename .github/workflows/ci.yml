name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - 'build.ps1'
      - '.pre-commit-config.yaml'
      - '.github/scripts/**'
      - '.github/workflows/ci.yml'
  # Every pull request runs this workflow, so that the "CI OK" job below always reports:
  # it is the check the ruleset of main requires. The `changes` job decides which parts
  # actually need to run. No `branches` filter: a stacked PR (based on another feature
  # branch) needs "CI OK" too, since it is retargeted to main when its base is merged.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Parties touchées
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Détection des fichiers modifiés
        id: filter
        shell: bash
        run: |
          # A push to main is already filtered by the `paths` of the trigger.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "website=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          echo "$files"
          code='^(backend/|frontend/|shared/|build\.ps1$|\.pre-commit-config\.yaml$|\.github/scripts/|\.github/workflows/ci\.yml$)'
          website='^(website/|\.github/workflows/(ci|pages)\.yml$)'
          if echo "$files" | grep -qE "$code"; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$files" | grep -qE "$website"; then echo "website=true" >> "$GITHUB_OUTPUT"; else echo "website=false" >> "$GITHUB_OUTPUT"; fi

  backend:
    name: Backend (uv, ruff, pytest & coverage)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installation de uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Configuration de Python 3.12
        run: uv python install 3.12

      - name: Installation des dépendances
        run: uv sync --locked --all-extras --dev

      - name: Lint et formatage (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Exécution des tests et couverture (pytest)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      # Total coverage for the README badge, published by the coverage-badge job.
      - name: Taux de couverture pour le badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: uv run coverage report --format=total > coverage-total.txt

      - name: Envoi du taux de couverture
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-total
          path: backend/coverage-total.txt

      - name: Contrat d'API à jour (shared/openapi.json)
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- ../shared/openapi.json

  frontend:
    name: Frontend (pnpm, ESLint, Prettier & Build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # La version de pnpm est lue dans le champ "packageManager" de frontend/package.json.
      - name: Installation de pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Configuration de Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: Types TypeScript à jour (src/api/schema.gen.ts)
        run: |
          pnpm gen:api
          git diff --exit-code -- src/api/schema.gen.ts

      - name: Vérification du linter (ESLint)
        run: pnpm lint

      - name: Vérification du formatage (Prettier)
        run: pnpm format:check

      - name: Tests unitaires et couverture (vitest)
        run: pnpm test:coverage

      # Shown on the run's summary page. No threshold yet: the rate is reported, not enforced.
      - name: Résumé de la couverture
        if: always() && hashFiles('frontend/coverage/coverage-summary.json') != ''
        shell: bash
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (name, m) => `| ${name} | ${m.pct} % | ${m.covered} / ${m.total} |`;
            console.log([
              "### Couverture du frontend",
              "",
              "| Mesure | Taux | Couvert |",
              "|---|---|---|",
              row("Lignes", t.lines),
              row("Instructions", t.statements),
              row("Fonctions", t.functions),
              row("Branches", t.branches),
            ].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Build de vérification
        run: pnpm build

      # The online demo embedded in the website (pages.yml deploys it from main).
      - name: Build de la démo du site
        run: pnpm build:demo

  # Pull requests only: on main, pages.yml builds and deploys the site.
  website:
    name: Site web (Prettier & Astro build)
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./website

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installation de pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: website/package.json

      - name: Configuration de Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérification du formatage (Prettier)
        run: pnpm format:check

      - name: Build du site
        run: pnpm build

  # The single check required by the ruleset of main. Skipped parts count as passed;
  # a failed or cancelled part fails it.
  ci-ok:
    name: CI OK
    needs: [changes, backend, frontend, website]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Résultat des parties
        shell: bash
        run: |
          echo "changes=${{ needs.changes.result }} backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} website=${{ needs.website.result }}"
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "Au moins une partie de la CI a échoué ou a été annulée."
            exit 1
          fi

  coverage-badge:
    name: Badge de couverture (main uniquement)
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: true

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Récupération du taux de couverture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-total

      - name: Génération et publication du badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pct=$(tr -d '[:space:]' < coverage-total.txt)
          bash .github/scripts/badge.sh "$RUNNER_TEMP/badges/coverage.svg" "couverture" "$pct %" "pct:$pct"
          bash .github/scripts/publish-badges.sh "$RUNNER_TEMP/badges"
