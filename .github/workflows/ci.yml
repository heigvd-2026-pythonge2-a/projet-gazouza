name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - '.github/workflows/ci.yml'

jobs:
  backend:
    name: Backend (uv, ruff, pytest & coverage)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Installation de uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Configuration de Python 3.12
        run: uv python install 3.12

      - name: Installation des dépendances
        run: uv sync --locked --all-extras --dev

      - name: Lint et formatage (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Exécution des tests et couverture (pytest)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Contrat d'API à jour (shared/openapi.json)
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- ../shared/openapi.json

  frontend:
    name: Frontend (pnpm, ESLint, Prettier & Build)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      # La version de pnpm est lue dans le champ "packageManager" de frontend/package.json.
      - name: Installation de pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Configuration de Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: Types TypeScript à jour (src/api/schema.gen.ts)
        run: |
          pnpm gen:api
          git diff --exit-code -- src/api/schema.gen.ts

      - name: Vérification du linter (ESLint)
        run: pnpm lint

      - name: Vérification du formatage (Prettier)
        run: pnpm format:check

      - name: Build de vérification
        run: pnpm build
