name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'pyproject.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'pyproject.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'

jobs:
  backend:
    name: Backend (uv, pytest & coverage)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Configuration de Python 3.12
        run: uv python install 3.12

      - name: Installation des dépendances
        run: uv sync --locked --all-extras --dev

      - name: Exécution des tests et couverture (pytest)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend (pnpm, ESLint & Build)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérification du linter (ESLint)
        run: pnpm lint

      - name: Build de vérification
        run: pnpm build