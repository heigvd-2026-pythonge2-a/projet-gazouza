name: Deploy Astro + Starlight to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      # The site embeds a demo of the app ("Essayer en ligne"), rebuilt with the frontend.
      - "frontend/**"
      - "shared/fixtures/**"
      - ".github/workflows/pages.yml"
  # Pull requests build the site in ci.yml (job "Site web"), behind the "CI OK" check.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installation de pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: website/package.json

      - name: Configuration de Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: |
            website/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      # Online demo of the app, built into website/public/demo/ (served at /demo/).
      - name: Build de la démo de l'app
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build:demo

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: website
        run: pnpm build

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "website/dist"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
