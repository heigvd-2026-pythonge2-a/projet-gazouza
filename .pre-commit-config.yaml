# Vérifications locales avant chaque commit (les mêmes que la CI, en plus rapide).
# Installation, une fois par clone :  cd backend ; uv run pre-commit install
# Lancer à la main sur tout le repo : cd backend ; uv run pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --no-sync --project backend ruff check --fix --force-exclude
        language: system
        types: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --no-sync --project backend ruff format --force-exclude
        language: system
        types: [python]
        files: ^backend/
      - id: prettier
        name: prettier (frontend)
        entry: node frontend/node_modules/prettier/bin/prettier.cjs --write --ignore-unknown
        language: system
        files: ^frontend/
        exclude: ^frontend/pnpm-lock\.yaml$
      # Run from the root: the ignore file of website/ is given, and its config names the Astro
      # plugin by path (a package name would be looked for from the root).
      - id: prettier-website
        name: prettier (website)
        entry: node website/node_modules/prettier/bin/prettier.cjs --write --ignore-unknown --ignore-path website/.prettierignore
        language: system
        files: ^website/
        exclude: ^website/(pnpm-lock\.yaml$|public/demo/)|\.mdx$
